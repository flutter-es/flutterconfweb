<!DOCTYPE html>
<html lang="es">
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">

    <!-- Primary Meta Tags -->
    <meta name="title" content="Flutter Conf Latam 2026 - La Conferencia de Flutter más grande de Latinoamérica">
    <meta name="description" content="Únete a desarrolladores, diseñadores y entusiastas de Flutter del 22 al 23 de septiembre de 2026 en la conferencia de Flutter más grande de Latinoamérica.">
    <meta name="keywords" content="Flutter, Conferencia, Latinoamérica, Desarrollo Mobile, Dart, Cross-platform, Flutter Conf, 2026">
    <meta name="author" content="Flutter Conf Latam Team">
    <meta name="robots" content="index, follow">
    <meta name="language" content="Spanish">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://flutterconflatam.dev/">
    <meta property="og:title" content="Flutter Conf Latam 2026 - La Conferencia de Flutter más grande de Latinoamérica">
    <meta property="og:description" content="Únete a desarrolladores, diseñadores y entusiastas de Flutter del 22 al 24 de septiembre de 2026.">
    <meta property="og:image" content="https://flutterconflatam.dev/icons/Icon-512.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="es_CO">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:site_name" content="Flutter Conf Latam">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://flutterconflatam.dev/">
    <meta name="twitter:title" content="Flutter Conf Latam 2026">
    <meta name="twitter:description" content="La conferencia de Flutter más grande de Latinoamérica. 22-24 Sept 2026.">
    <meta name="twitter:image" content="https://flutterconflatam.dev/icons/Icon-512.png">

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flutter Conf Latam">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#042B59">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#042B59">

    <!-- Icons -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon.ico"/>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://flutterconflatam.dev/">

    <title>Flutter Conf Latam 2026 - La Conferencia de Flutter más grande de Latinoamérica</title>
    <link rel="manifest" href="manifest.json">

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

    <style>
        html, body {
        background-color: #042B59;
        margin: 0;
        height: 100%;
      }
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Loading indicator - shown while Flutter app loads */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #042B59;
        z-index: 9999;
      }

      .loader {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #FFD600;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .flutter-ready #loading {
        display: none;
      }
    </style>
</head>
<body>

<div id="loading">
  <div class="loader"></div>
</div>

<script>
    {{flutter_bootstrap_js}}

    window.initTime = Date.now();

    window.addEventListener('load', function(ev) {
      {{flutter_js}}

      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();

            document.body.classList.add('flutter-ready');
            console.log('[Flutter Conf] App initialized in', Date.now() - window.initTime, 'ms');
          });
        }
      });
    });
</script>
</body>
</html>
